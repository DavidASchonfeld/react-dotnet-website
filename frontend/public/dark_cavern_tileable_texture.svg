    <circle cx="155" cy="110" r="1" fill="#352d42" opacity="0.4"/>
    <circle cx="240" cy="65" r="1.5" fill="#3a3045" opacity="0.45"/>
    <circle cx="320" cy="95" r="1" fill="#352d42" opacity="0.4"/>
    <circle cx="90" cy="175" r="1.2" fill="#3a3045" opacity="0.5"/>
