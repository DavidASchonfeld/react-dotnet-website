    <circle cx="270" cy="155" r="1" fill="#3a3045" opacity="0.45"/>
    <circle cx="370" cy="185" r="1.2" fill="#352d42" opacity="0.5"/>
    <circle cx="50" cy="260" r="1" fill="#3a3045" opacity="0.4"/>
    <circle cx="145" cy="280" r="1.5" fill="#352d42" opacity="0.45"/>
