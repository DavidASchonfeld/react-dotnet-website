<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" style="display:block;">
<defs>
  <!-- Coarse horizontal laid lines — aged rough paper has more visible weave -->
  <pattern id="h1" x="0" y="0" width="400" height="2.2" patternUnits="userSpaceOnUse">
    <line x1="0" y1="1.1" x2="400" y2="1.1" stroke="#9a7040" stroke-width="0.22" opacity="0.18"/>
  </pattern>
  <pattern id="h2" x="0" y="1.1" width="400" height="5.5" patternUnits="userSpaceOnUse">
    <line x1="0" y1="2.75" x2="400" y2="2.75" stroke="#8a6030" stroke-width="0.38" opacity="0.09"/>
  </pattern>

  <!-- Wider vertical chain lines — coarser western paper stock -->
  <pattern id="v1" x="0" y="0" width="6" height="400" patternUnits="userSpaceOnUse">
    <line x1="3" y1="0" x2="3" y2="400" stroke="#a07838" stroke-width="0.18" opacity="0.12"/>
  </pattern>

  <!-- Coarse paper grain — worn, aged texture -->
  <filter id="papergrain" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.52" numOctaves="4" seed="17" stitchTiles="stitch" result="noise"/>
    <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
    <!-- Compress to warm-tan range -->
    <feComponentTransfer in="mono" result="compressed">
      <feFuncR type="linear" slope="0.16" intercept="0.76"/>
      <feFuncG type="linear" slope="0.13" intercept="0.68"/>
      <feFuncB type="linear" slope="0.08" intercept="0.52"/>
      <feFuncA type="linear" slope="1"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" in2="compressed" mode="multiply" result="out"/>
  </filter>

  <!-- Age spots and foxing — old paper has warm brown speckles -->
  <filter id="foxing" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="1" seed="22" stitchTiles="stitch" result="d"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.28  0 0 0 0 0.10  0 0 0 0.18 0" in="d"/>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>

  <!-- Low-frequency tone variation — sun-faded and worn unevenly -->
  <filter id="toneshift" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="2" seed="9" stitchTiles="stitch" result="t"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.58  0 0 0 0 0.44  0 0 0 0 0.22  0 0 0 0.20 0" in="t"/>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>

  <!-- Edge darkening — worn edges of a well-handled piece of paper -->
  <radialGradient id="edge" cx="50%" cy="50%" r="72%" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(200 200) scale(200 200) translate(-1 -1)">
    <stop offset="55%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#6b4010" stop-opacity="0.22"/>
  </radialGradient>

  <!-- Wrinkle/crumple shading — feTurbulence as a bump map, feDiffuseLighting computes 3D fold shadows -->
  <filter id="wrinkle" color-interpolation-filters="sRGB" x="-2%" y="-2%" width="104%" height="104%">
    <!-- Low-freq directional turbulence: asymmetric X/Y frequencies produce anisotropic fold shapes -->
    <feTurbulence type="turbulence" baseFrequency="0.022 0.038" numOctaves="3" seed="31" stitchTiles="stitch" result="surf"/>
    <!-- Treat turbulence as height map; compute how a distant light source would shade the 3D surface -->
    <feDiffuseLighting in="surf" surfaceScale="5" diffuseConstant="0.85" lighting-color="white" result="lit">
      <feDistantLight azimuth="45" elevation="52"/>
    </feDiffuseLighting>
    <!-- Desaturate lighting result to pure grayscale before blending -->
    <feColorMatrix type="saturate" values="0" in="lit" result="gray"/>
    <!-- soft-light: values above 0.5 (ridge facing light) brighten the paper; below 0.5 (crease shadow) darken it -->
    <feBlend in="SourceGraphic" in2="gray" mode="soft-light"/>
  </filter>

</defs>

<!-- Base: warm golden tan — like a sun-bleached wanted poster -->
<rect width="400" height="400" fill="#d4ae64"/>

<!-- Broad tone variation — uneven weathering across the sheet -->
<rect width="400" height="400" fill="#d4ae64" filter="url(#toneshift)"/>

<!-- Coarse paper grain — rough old stock paper -->
<rect width="400" height="400" fill="#d4ae64" filter="url(#papergrain)"/>

<!-- Age foxing — warm brown speckles of aged paper -->
<rect width="400" height="400" fill="#d4ae64" filter="url(#foxing)" opacity="0.85"/>

<!-- Paper wrinkles — 3D fold shading from diffuse lighting on turbulence bump map -->
<rect width="400" height="400" fill="#d4ae64" filter="url(#wrinkle)" opacity="0.50"/>

<!-- Laid lines — visible weave of handmade paper -->
<rect width="400" height="400" fill="url(#h1)"/>
<rect width="400" height="400" fill="url(#h2)"/>

<!-- Chain lines -->
<rect width="400" height="400" fill="url(#v1)"/>

<!-- Edge darkening — worn/handled border -->
<rect width="400" height="400" fill="url(#edge)"/>

</svg>
