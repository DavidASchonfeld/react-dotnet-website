<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <!-- Fine paper grain: high-frequency fractal noise compressed to near-white -->
    <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.72 0.68" numOctaves="4" seed="3" result="noise"/>
      <!-- Compress grain to a very light, warm range — dark enough to be visible, light enough not to overwhelm -->
      <feColorMatrix type="matrix"
        values="0  0  0  0  0.88
                0  0  0  0  0.83
                0  0  0  0  0.75
                0  0  0 -6  5.5"
        result="tinted-grain"/>
      <feBlend in="SourceGraphic" in2="tinted-grain" mode="multiply" result="blended"/>
    </filter>

    <!-- Very subtle horizontal roll lines at low frequency — suggests newsprint rolling press -->
    <filter id="roll-lines" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0 0.012" numOctaves="1" seed="7" result="rolls"/>
      <feColorMatrix type="matrix"
        values="0  0  0  0  0.96
                0  0  0  0  0.93
                0  0  0  0  0.87
                0  0  0 -10 10"
        result="faint-rolls"/>
      <feBlend in="SourceGraphic" in2="faint-rolls" mode="multiply"/>
    </filter>

    <!-- Combined pattern: base aged-paper color + grain layer + roll-line layer -->
    <pattern id="newsprint-pattern" x="0" y="0" width="400" height="400" patternUnits="userSpaceOnUse">
      <!-- Base aged newsprint color -->
      <rect width="400" height="400" fill="#f0ece0"/>
      <!-- Fine grain layer -->
      <rect width="400" height="400" fill="#c8b89a" filter="url(#paper-grain)" opacity="0.55"/>
      <!-- Faint horizontal roll marks -->
      <rect width="400" height="400" fill="#b0a090" filter="url(#roll-lines)" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Render the full tile -->
  <rect width="400" height="400" fill="url(#newsprint-pattern)"/>
</svg>
