<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <circle cx="32" cy="32" r="32" fill="#111827"/>

  <!-- Film reel body -->
  <circle cx="32" cy="32" r="29" fill="#1f2937"/>

  <!-- Outer rim -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="#d97706" stroke-width="2.5"/>

  <!-- 8 sprocket holes at radius 26 from center, every 45° -->
  <circle cx="32"   cy="6"    r="2.5" fill="#111827"/>
  <circle cx="50.4" cy="13.6" r="2.5" fill="#111827"/>
  <circle cx="58"   cy="32"   r="2.5" fill="#111827"/>
  <circle cx="50.4" cy="50.4" r="2.5" fill="#111827"/>
  <circle cx="32"   cy="58"   r="2.5" fill="#111827"/>
  <circle cx="13.6" cy="50.4" r="2.5" fill="#111827"/>
  <circle cx="6"    cy="32"   r="2.5" fill="#111827"/>
  <circle cx="13.6" cy="13.6" r="2.5" fill="#111827"/>

  <!-- 3 reel spokes at 0°/120°/240° from top, spanning r=13 to r=22 -->
  <!-- 0° (top): (32,19) → (32,10) -->
  <line x1="32"   y1="19"  x2="32"   y2="10"  stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
  <!-- 120°: (43.3,38.5) → (51.1,43.0) -->
  <line x1="43.3" y1="38.5" x2="51.1" y2="43.0" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
  <!-- 240°: (20.7,38.5) → (12.9,43.0) -->
  <line x1="20.7" y1="38.5" x2="12.9" y2="43.0" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>

  <!-- Center hub -->
  <circle cx="32" cy="32" r="12" fill="#111827" stroke="#d97706" stroke-width="1.5"/>

  <!-- Game controller face buttons in diamond pattern at r=6 from center -->
  <!-- Top = Y (yellow) -->
  <circle cx="32" cy="26" r="3.2" fill="#eab308"/>
  <!-- Right = B (red) -->
  <circle cx="38" cy="32" r="3.2" fill="#ef4444"/>
  <!-- Bottom = A (green) -->
  <circle cx="32" cy="38" r="3.2" fill="#22c55e"/>
  <!-- Left = X (blue) -->
  <circle cx="26" cy="32" r="3.2" fill="#3b82f6"/>
</svg>
