<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" style="display:block;">
<defs>
  <!-- Very dense fine horizontal lines - the #1 newsprint tell -->
  <pattern id="h1" x="0" y="0" width="400" height="1.4" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0.7" x2="400" y2="0.7" stroke="#b0aeaa" stroke-width="0.18" opacity="0.22"/>
  </pattern>
  <pattern id="h2" x="0" y="0.7" width="400" height="2.8" patternUnits="userSpaceOnUse">
    <line x1="0" y1="1.4" x2="400" y2="1.4" stroke="#9e9c98" stroke-width="0.3" opacity="0.1"/>
  </pattern>

  <!-- Subtle vertical chain lines -->
  <pattern id="v1" x="0" y="0" width="4.5" height="400" patternUnits="userSpaceOnUse">
    <line x1="2.25" y1="0" x2="2.25" y2="400" stroke="#b2b0ac" stroke-width="0.14" opacity="0.14"/>
  </pattern>

  <!-- True paper grain: high-freq, low-contrast, achromatic -->
  <filter id="papergrain" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" seed="42" stitchTiles="stitch" result="noise"/>
    <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
    <!-- Compress to near-white range so it reads as surface not fabric -->
    <feComponentTransfer in="mono" result="compressed">
      <feFuncR type="linear" slope="0.12" intercept="0.82"/>
      <feFuncG type="linear" slope="0.12" intercept="0.82"/>
      <feFuncB type="linear" slope="0.11" intercept="0.82"/>
      <feFuncA type="linear" slope="1"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" in2="compressed" mode="multiply" result="out"/>
  </filter>

  <!-- Micro speckle: tiny dark dots like newsprint ink absorption -->
  <filter id="dots" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="1.9" numOctaves="1" seed="7" stitchTiles="stitch" result="d"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.3  0 0 0 0 0.28  0 0 0 0.13 0" in="d"/>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>

  <!-- Very low-frequency tone shift — paper is never perfectly uniform -->
  <filter id="toneshift" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="2" seed="3" stitchTiles="stitch" result="t"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.62  0 0 0 0 0.61  0 0 0 0 0.57  0 0 0 0.14 0" in="t"/>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>

</defs>

<!-- Base: neutral cool grey, like fresh newsprint -->
<rect width="400" height="400" fill="#d8d6d2" style="fill:rgb(216, 214, 210);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

<!-- Low-freq tone variation first (broad light/dark regions) -->
<rect width="400" height="400" fill="#d8d6d2" filter="url(#toneshift)" opacity="1" style="fill:rgb(216, 214, 210);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

<!-- Paper grain — tight, compressed, NOT fibrous -->
<rect width="400" height="400" fill="#d8d6d2" filter="url(#papergrain)" opacity="1" style="fill:rgb(216, 214, 210);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

<!-- Micro ink-absorption dots -->
<rect width="400" height="400" fill="#d8d6d2" filter="url(#dots)" opacity="0.9" style="fill:rgb(216, 214, 210);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.9;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

<!-- Horizontal laid lines — crisp, regular, mechanical -->
<rect width="400" height="400" fill="url(#h1)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<rect width="400" height="400" fill="url(#h2)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

<!-- Vertical chain lines -->
<rect width="400" height="400" fill="url(#v1)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>


</svg>