<svg viewBox="0 0 400 410" width="400" height="410" xmlns="http://www.w3.org/2000/svg" style="display:block;">
  <defs>
    <pattern id="warp" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#d9c9a8"/>
      <rect x="0" y="0" width="2.8" height="6" fill="#cfc09a" opacity="0.7"/>
    </pattern>
    <pattern id="weft" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="6" height="2.8" fill="#c4b28a" opacity="0.45"/>
    </pattern>
    <pattern id="grain" x="0" y="0" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="none"/>
      <rect x="0" y="0" width="1" height="1" fill="#9e8a68" opacity="0.08"/>
      <rect x="2" y="1" width="1" height="1" fill="#7a6848" opacity="0.06"/>
      <rect x="1" y="2" width="1" height="1" fill="#b8a27a" opacity="0.09"/>
    </pattern>
    <pattern id="crosshatch" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="12" y2="12" stroke="#a8926a" stroke-width="0.3" opacity="0.18"/>
      <line x1="12" y1="0" x2="0" y2="12" stroke="#a8926a" stroke-width="0.3" opacity="0.12"/>
    </pattern>
    <pattern id="bumps" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.7" fill="#8c7652" opacity="0.12"/>
      <circle cx="0" cy="0" r="0.5" fill="#8c7652" opacity="0.09"/>
      <circle cx="8" cy="0" r="0.5" fill="#8c7652" opacity="0.09"/>
      <circle cx="0" cy="8" r="0.5" fill="#8c7652" opacity="0.09"/>
      <circle cx="8" cy="8" r="0.5" fill="#8c7652" opacity="0.09"/>
    </pattern>
    <pattern id="fine-horiz" x="0" y="0" width="1" height="5" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="400" y2="0" stroke="#b9a47c" stroke-width="0.35" opacity="0.22"/>
    </pattern>
    <pattern id="fine-vert" x="0" y="0" width="5" height="1" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="400" stroke="#b0956b" stroke-width="0.35" opacity="0.18"/>
    </pattern>
